<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:8px 14px;font:13px system-ui;color:#7a5b00">🔬 <b>実データ入力版</b>：自社の業務(頻度・時間・人数・重要度・実現性)を<b>入力すると、その値から優先度とROIを実計算</b>します。削減率は類型別の想定値（PoCで実測してください）。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
const SOL_RED={ "業務自動化":60, "エージェント":50, "生成支援":45, "RAG検索":40 };
const SOLS=Object.keys(SOL_RED);
// レーダー診断軸(AX成熟度): 各業務の平均から算出、業界ベンチと比較
const AXIS=["自動化余地","効果規模","実現容易性","重要度対応","対象網羅","手段の多様性"];
const BENCH=[55,50,62,52,45,48]; // 業界平均(ヒューリスティック初期値・編集可)
const QCOLOR={"今すぐPoC":"#17a673","重点投資":"#f0a500","クイックウィン":"#4c8bf5","見送り候補":"#9aa5b1"};
const QDESC={"今すぐPoC":"影響も容易性も高い→最優先","重点投資":"影響は高いが難易度も高い→計画的に","クイックウィン":"影響は小さいがすぐ実現→小さく勝つ","見送り候補":"影響も容易性も低い→後回し"};
const STEP={ "業務自動化":["対象業務の手順を棚卸し・定型部分を特定","RPA/スクリプトで定型処理を試作","例外処理と承認フローを設計","2週間の並走で精度検証→本番"],
  "エージェント":["ツール(API)と権限を定義","ドライラン環境で自律実行を検証","人間承認ゲートを設置","段階的に自動化範囲を拡大"],
  "生成支援":["良質なプロンプト/テンプレを整備","社内ナレッジをRAGで接続","ドラフト生成→人間レビューの流れを確立","品質基準を満たしたら量産"],
  "RAG検索":["FAQ/規程を構造化して取り込み","検索精度(recall/precision)を計測","根拠(出典)提示を必須化","一次対応の自動化率を計測しながら拡大"] };
const TPL=[
  {name:"月次決算レポート", freq:1,  hours:8.0, people:2, crit:5, feas:80, sol:"業務自動化"},
  {name:"広告運用",       freq:60, hours:1.0, people:3, crit:3, feas:90, sol:"エージェント"},
  {name:"定例レポート作成", freq:20, hours:2.0, people:4, crit:3, feas:95, sol:"業務自動化"},
  {name:"SEO記事制作",     freq:15, hours:4.0, people:3, crit:3, feas:45, sol:"生成支援"},
  {name:"問い合わせ一次対応", freq:200, hours:0.2, people:3, crit:2, feas:70, sol:"RAG検索"},
];

function enrich(t,maxH){
  const H=t.freq*t.hours*t.people;
  const volScore=Math.round(Math.log1p(H)/Math.log1p(maxH||1)*100)||0;
  const critScore=Math.round(t.crit/5*100);
  const impact=Math.round(0.55*volScore+0.45*critScore);
  const red=SOL_RED[t.sol]||45;
  const priority=Math.round(0.5*impact+0.5*t.feas);
  const quad=impact>=50?(t.feas>=50?"今すぐPoC":"重点投資"):(t.feas>=50?"クイックウィン":"見送り候補");
  return {...t, H, volScore, critScore, impact, red, priority, quad};
}
const color=v=>v>=70?"#17a673":v>=50?"#f0a500":"#e0533b";
function level(t){return t>=70?["先進","#0f7a54"]:t>=55?["標準以上","#17a673"]:t>=40?["平均並み","#f0a500"]:["改善余地大","#e0533b"];}

function Radar({own,bench}){
  const cx=150,cy=145,R=100,N=own.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,ratio)=>[cx+Math.cos(ang(i))*R*ratio, cy+Math.sin(ang(i))*R*ratio];
  const poly=arr=>arr.map((v,i)=>pt(i,Math.max(0,Math.min(1,v/100))).join(",")).join(" ");
  return (<svg width="100%" viewBox="0 0 300 300" style={{maxWidth:360}}>
    {[0.33,0.66,1].map((rr,k)=>(<polygon key={k} points={AXIS.map((_,i)=>pt(i,rr).join(",")).join(" ")} fill="none" stroke="#e3e8ee"/>))}
    {AXIS.map((_,i)=>{const[x,y]=pt(i,1);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#e3e8ee"/>;})}
    <polygon points={poly(bench)} fill="#8aa9d633" stroke="#8aa9d6" strokeWidth="2"/>
    <polygon points={poly(own)} fill="#1a5fb433" stroke="#1a5fb4" strokeWidth="2.5"/>
    {AXIS.map((a,i)=>{const[x,y]=pt(i,1.16);return <text key={i} x={x} y={y} textAnchor="middle" fontSize="9" fill="#556">{a}</text>;})}
  </svg>);
}


// ===== 自動保存 & データ書き出し/読み込み（入力内容がリロードで消えないようにする） =====
const STORE="axaudit_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){
    try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}
  },[name,v]);
  return [v,setV];
}
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}
  }
  return o;
}
function DataBar(){
  const [msg,setMsg]=React.useState("");
  const fileRef=React.useRef(null);
  const save=function(){
    try{
      var data={_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";
      a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);
    }catch(e){setMsg("書き出しに失敗しました");}
  };
  const load=function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!j.data)throw new Error("形式が違います");
        if(j._tool&&j._tool!==STORE){ if(!confirm("別のツールのファイルのようです。読み込みますか？"))return; }
        Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
        location.reload();
      }catch(err){setMsg("読み込めませんでした（"+err.message+"）");}
    };
    rd.readAsText(f);
  };
  const clear=function(){
    if(!confirm("入力した内容をすべて消して、最初の状態に戻します。よろしいですか？"))return;
    var del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    location.reload();
  };
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

function App(){
  const [rows,setRows]=usePersist("rows",TPL);
  const [rate,setRate]=usePersist("rate",3000);
  const [sel,setSel]=React.useState(0);
  const [bench,setBench]=usePersist("bench",BENCH);
  const maxH=Math.max(1,...rows.map(t=>t.freq*t.hours*t.people));
  const DATA=rows.map(t=>enrich(t,maxH)).sort((a,b)=>b.priority-a.priority);
  const d=DATA[Math.min(sel,DATA.length-1)]||DATA[0];
  const savedM=d?d.H*d.red/100:0, savedY=savedM*12, yen=Math.round(savedY*rate/10000);
  const topPoC=DATA.filter(t=>t.quad==="今すぐPoC");
  const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/(a.length||1));
  // レーダー各軸を実データから算出(各軸は異なる入力変数に基づく)
  const distinctSol=new Set(rows.map(t=>t.sol)).size;
  const own=[
    avg(DATA.map(t=>t.red*100/60)),                 // 自動化余地: 削減率(ソリューション類型)
    avg(DATA.map(t=>t.volScore)),                   // 効果規模: 月間工数の対数スコア
    avg(DATA.map(t=>t.feas)),                        // 実現容易性: 入力の実現性
    avg(DATA.map(t=>t.critScore)),                   // 重要度対応: 重要度
    Math.min(100,rows.length*20),                    // 対象網羅: 診断した業務数(5件で100)
    Math.round(distinctSol/SOLS.length*100),         // 手段の多様性: 使っているソリューション類型の幅
  ].map(v=>Math.max(0,Math.min(100,Math.round(v))));
  const ownTotal=avg(own);
  const benchTotal=avg(bench);
  const diff=ownTotal-benchTotal;
  const [lvl,lvlc]=level(ownTotal);
  const upd=(i,k,v)=>setRows(rs=>rs.map((r,j)=>j===i?{...r,[k]:(k==="name"||k==="sol")?v:(Number(v)||0)}:r));
  const del=i=>setRows(rs=>rs.filter((_,j)=>j!==i));
  const add=()=>setRows(rs=>[...rs,{name:"新規業務",freq:10,hours:1,people:1,crit:3,feas:60,sol:"業務自動化"}]);
  // 段階プラン: 今すぐPoC → 重点投資
  const invest=DATA.filter(t=>t.quad==="重点投資");

  return (<div className="wrap"><DataBar/>
    <h1>AX診断プラットフォーム <span className="sub">自社業務を入力→AI導入の優先度・ROI・成熟度を実計算</span></h1>
    <div style={{margin:"6px 0"}}><span className="rate">人件費(時給) <input type="number" value={rate} onChange={e=>setRate(Number(e.target.value)||0)}/> 円/h</span>
      <span className="sub"> ← この単価で金額換算します(変更可)</span></div>

    <div className="card">
      <div className="real">✏️ <b>自社の業務を入力</b>（行の追加・編集・削除可）。頻度=月あたり回数 / 時間=1回あたりh / 重要度=1〜5 / 実現性=0〜100。入力値からリアルタイムに再計算します。</div>
      <table><thead><tr><th className="f">業務名</th><th>頻度/月</th><th>時間h</th><th>人数</th><th>重要度</th><th>実現性</th><th>ソリューション</th><th></th></tr></thead>
        <tbody>{rows.map((t,i)=>(<tr key={i}>
          <td className="f"><input className="nm" value={t.name} onChange={e=>upd(i,"name",e.target.value)}/></td>
          <td><input value={t.freq} onChange={e=>upd(i,"freq",e.target.value)}/></td>
          <td><input value={t.hours} onChange={e=>upd(i,"hours",e.target.value)}/></td>
          <td><input value={t.people} onChange={e=>upd(i,"people",e.target.value)}/></td>
          <td><input value={t.crit} onChange={e=>upd(i,"crit",e.target.value)}/></td>
          <td><input value={t.feas} onChange={e=>upd(i,"feas",e.target.value)}/></td>
          <td><select value={t.sol} onChange={e=>upd(i,"sol",e.target.value)}>{SOLS.map(s=>(<option key={s} value={s}>{s}</option>))}</select></td>
          <td><button className="del" onClick={()=>del(i)}>×</button></td></tr>))}
        </tbody></table>
      <button className="add" onClick={add}>＋ 業務を追加</button>
      <button className="ghost" onClick={()=>setRows(TPL)}>サンプルに戻す</button>
    </div>

    <div className="card" style={{display:"flex",gap:20,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
      <div style={{textAlign:"center"}}>
        <h2>AX成熟度スコア</h2>
        <div style={{fontSize:44,fontWeight:"bold",color:color(ownTotal)}}>{ownTotal}<span style={{fontSize:16,color:"#8a97a6"}}> /100</span></div>
        <span className="lvl" style={{background:lvlc}}>水準: {lvl}</span>
        <div style={{marginTop:8,fontSize:14}}>業界平均({benchTotal})より <b className={diff>=0?"":""} style={{color:diff>=0?"#0f7a54":"#c0392b"}}>{diff>=0?"+"+diff+"点 上":diff+"点 下"}</b></div>
      </div>
      <div><Radar own={own} bench={bench}/><div className="sub" style={{textAlign:"center"}}>■自社 ／ ■業界平均（外周=100）</div></div>
    </div>

    <div className="card" style={{display:"flex",gap:20,flexWrap:"wrap",alignItems:"flex-start"}}>
      <div style={{flex:1,minWidth:250}}>
        <div className="ai"><b>🤖 分析</b><br/>
          今すぐPoC候補は <b>{topPoC.length?topPoC.map(t=>t.name).join("・"):"（なし）"}</b>。最優先は <b>{DATA[0].name}</b>（優先度{DATA[0].priority}）。
          {DATA[0].name}を{DATA[0].sol}で約{DATA[0].red}%削減すると、時給{rate.toLocaleString()}円換算で年 約{Math.round(DATA[0].H*DATA[0].red/100*12*rate/10000)}万円の削減見込みです。
          {diff>=0?"　成熟度は業界平均を上回っており、":"　成熟度は業界平均を下回っており、"}特に伸ばすべき軸は <b>{AXIS[own.indexOf(Math.min(...own))]}</b> です。</div>
      </div>
    </div>

    <div className="card">
      <h2>優先度ランキング（クリックで根拠表示）</h2>
      <p className="sub">影響 = <b>工数</b>(頻度×時間×人数) と <b>重要度</b>(1件の重み) の両方から算出。<b>頻度が低くても重要度が高ければ上位</b>になります。</p>
      <table><thead><tr><th className="f">業務</th><th>優先度</th><th>影響</th><th>├ 工数</th><th>├ 重要度</th><th>容易性</th><th>月間工数</th><th>判定</th></tr></thead>
        <tbody>{DATA.map((t,i)=>(<tr key={i} className={"clk"+(i===sel?" sel":"")} onClick={()=>setSel(i)}>
          <td className="f"><b>{t.name}</b></td><td><b>{t.priority}</b></td><td>{t.impact}</td>
          <td className="muted">{t.volScore}</td><td className="muted">{t.critScore}</td><td>{t.feas}</td><td>{Math.round(t.H)}h</td>
          <td><span className="pill" style={{background:QCOLOR[t.quad]+"22",color:QCOLOR[t.quad]}}>{t.quad}</span></td></tr>))}
        </tbody></table>
    </div>

    {d && <div className="card">
      <h2>「{d.name}」の判定根拠と年間ROI</h2>
      <div className="kv">
        <div>判定: <span className="pill" style={{background:QCOLOR[d.quad]+"22",color:QCOLOR[d.quad]}}>{d.quad}</span> — {QDESC[d.quad]}（影響{d.impact}{d.impact>=50?"≥50":"<50"} × 容易性{d.feas}{d.feas>=50?"≥50":"<50"}）</div>
        <div>■ 影響 {d.impact}: 工数インパクト {d.volScore}(月{Math.round(d.H)}h = {d.freq}回×{d.hours}h×{d.people}人) ＋ 重要度インパクト {d.critScore}(重要度 {d.crit}/5)</div>
      </div>
      <h3>年間 約{yen}万円 の削減内訳</h3>
      <div className="calc">
        <div className="eq">① 現状の総時間 = {d.freq}回/月 × {d.hours}h × {d.people}人 = <b>{Math.round(d.H)} 時間/月</b></div>
        <div className="eq">② 「{d.sol}」で <b>{d.red}%</b> を自動化(類型別の想定削減率)</div>
        <div className="eq">③ 月間削減 = {Math.round(d.H)}h × {d.red}% = <b>{savedM.toFixed(0)} 時間/月</b></div>
        <div className="eq">④ 年間削減 = {savedM.toFixed(0)}h × 12 = <b>{savedY.toFixed(0)} 時間/年</b></div>
        <div className="eq">⑤ 人件費換算 = {savedY.toFixed(0)}h × {rate.toLocaleString()}円 = <span className="big">年 約 {yen} 万円</span></div>
      </div>
      <p className="note">※削減率{d.red}%は「{d.sol}」類型の想定値(実測ではない)。PoCで実測してください。</p>
    </div>}

    <div className="card">
      <h2>🚀 段階的アクションプラン</h2>
      {topPoC.length>0 && <div className="plan">
        <div className="tierlabel">① まず着手する（今すぐPoC＝影響も実現性も高い）</div>
        <ul>{topPoC.map((t,k)=>(<li key={k}><b>{t.name}</b>（{t.sol}／想定{t.red}%削減／年 約{Math.round(t.H*t.red/100*12*rate/10000)}万円）
          <br/><span className="sub">進め方: {STEP[t.sol].join(" → ")}</span></li>))}</ul>
      </div>}
      {invest.length>0 && <div className="plan">
        <div className="tierlabel">② 次に計画的に投資（重点投資＝影響大だが難度高）</div>
        <ul>{invest.map((t,k)=>(<li key={k}><b>{t.name}</b>：実現性{t.feas}を上げる施策(データ整備/API連携)を先行。まず{STEP[t.sol][0]}から。</li>))}</ul>
      </div>}
      {topPoC.length===0 && invest.length===0 && <p className="sub">現在の入力では今すぐPoC/重点投資に該当する業務がありません。重要度や実現性を見直すか、対象業務を追加してください。</p>}
    </div>

    <p className="note">※削減率は類型別の想定値、成熟度の各軸は入力値から算出したヒューリスティック指標です。業界平均は初期値(編集可)であり、正確な外部ベンチではありません。最終的な効果はPoCで実測してください。</p>
  </div>);
}

function ActionBar(){
  const [msg,setMsg]=React.useState("");
  // 画面の内容をテキストとして取り出し、Excel等に貼れる形でコピーする
  const copyAll=function(){
    try{
      var root=document.getElementById("root");
      var out=[];
      root.querySelectorAll("h1,h2,h3,table,.metric,.verdict,.todo li,.chk").forEach(function(el){
        if(el.tagName==="TABLE"){
          el.querySelectorAll("tr").forEach(function(tr){
            var cells=[];
            tr.querySelectorAll("th,td").forEach(function(td){
              var inp=td.querySelector("input,select");
              cells.push(((inp?inp.value:td.textContent)||"").trim().replace(/\s+/g," "));
            });
            if(cells.join("").trim())out.push(cells.join("\t"));
          });
          out.push("");
        }else{
          var t=(el.textContent||"").trim().replace(/\s+/g," ");
          if(t)out.push(t);
        }
      });
      var text=out.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){setMsg("コピーしました（Excelやメールに貼れます）");},function(){fallback(text);});
      }else fallback(text);
      function fallback(t){
        var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");setMsg("コピーしました");}catch(e){setMsg("コピーできませんでした");}
        document.body.removeChild(ta);
      }
      setTimeout(function(){setMsg("");},3000);
    }catch(e){setMsg("コピーできませんでした");}
  };
  return (<div className="noprint" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"0 0 12px"}}>
    <button onClick={function(){window.print();}}
      style={{border:0,borderRadius:8,background:"#334155",color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      🖨 印刷 / PDFで保存</button>
    <button onClick={copyAll}
      style={{border:0,borderRadius:8,background:"#e2e8f0",color:"#334155",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      📋 結果をコピー（Excelに貼れます）</button>
    {msg && <span style={{fontSize:12.5,color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

    <div><b style={{color:"#556"}}>提供</b>：株式会社デジタルアイデンティティ</div>

// ===== サーバー保管・複数人共有 =====
const API="https://di-tools-api.vercel.app/api/workspace";
function qs(k){try{return new URLSearchParams(location.search).get(k)||"";}catch(e){return "";}}
function ShareBar(){
  const [busy,setBusy]=React.useState(false);
  const [msg,setMsg]=React.useState("");
  const [info,setInfo]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":__share");return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const [who,setWho]=React.useState(function(){
    try{return localStorage.getItem("di_who")||"";}catch(e){return "";}
  });
  const [loaded,setLoaded]=React.useState(null);
  const [title,setTitle]=React.useState("");

  // 共有リンクで開かれた場合はサーバーから読み込む
  React.useEffect(function(){
    var id=qs("ws"); if(!id)return;
    var key=qs("key");
    setBusy(true);
    fetch(API+"?id="+encodeURIComponent(id))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg("読み込めませんでした: "+j.error);setBusy(false);return;}
        Object.keys(j.data||{}).forEach(function(k){
          localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));
        });
        if(key)localStorage.setItem(STORE+":__share",JSON.stringify({id:id,editKey:key}));
        setLoaded({title:j.title,updatedBy:j.updatedBy,updatedAt:j.updatedAt,canEdit:!!key});
        // 取り込んだ内容を反映するため再読込（?ws= は外す）
        if(!sessionStorage.getItem("di_loaded_"+id)){
          sessionStorage.setItem("di_loaded_"+id,"1");
          location.replace(location.pathname);
        }
        setBusy(false);
      })
      .catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  },[]);

  const remember=function(v){setWho(v);try{localStorage.setItem("di_who",v);}catch(e){}};
  const body=function(){
    return {tool:STORE, title:title||document.title, who:who,
      data:(typeof collectAll==="function"?collectAll():{})};
  };
  const create=function(){
    setBusy(true);setMsg("");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        var nx={id:j.id,editKey:j.editKey};
        localStorage.setItem(STORE+":__share",JSON.stringify(nx));
        setInfo(nx);setMsg("サーバーに保存しました");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const update=function(){
    if(!info)return create();
    setBusy(true);setMsg("");
    fetch(API+"?id="+info.id+"&key="+info.editKey,{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        setMsg("サーバーに保存しました（"+new Date().toLocaleTimeString("ja-JP")+"）");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const linkView=info?(location.origin+location.pathname+"?ws="+info.id):"";
  const linkEdit=info?(linkView+"&key="+info.editKey):"";
  const copy=function(t,label){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){setMsg(label+"をコピーしました");
        setTimeout(function(){setMsg("");},3000);});
    }else{
      var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");setMsg(label+"をコピーしました");}catch(e){}
      document.body.removeChild(ta);
    }
  };
  const bs={border:0,borderRadius:7,padding:"7px 12px",cursor:"pointer",fontSize:12.5};
  return (<div className="noprint" style={{background:"#eef4fb",border:"1px solid #c5d8f5",borderRadius:10,
      padding:"10px 12px",margin:"0 0 12px",fontSize:13,color:"#1a4d8f"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span>☁️ <b>サーバーに保存して、チームで共有できます</b></span>
      <span style={{flex:1}}></span>
      <input value={who} onChange={function(e){remember(e.target.value);}} placeholder="お名前（任意）"
        style={{border:"1px solid #b9cbe4",borderRadius:6,padding:"6px 8px",fontSize:12.5,width:120}}/>
      {!info && <button onClick={create} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"サーバーに保存"}</button>}
      {info && <button onClick={update} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"変更を保存"}</button>}
    </div>
    {loaded && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px"}}>
      📥 共有リンクから読み込みました{loaded.updatedBy?"（最終更新: "+loaded.updatedBy+"）":""}。
      {loaded.canEdit?"このリンクは編集できます。":"このリンクは閲覧専用です（変更しても他の人には反映されません）。"}
    </div>}
    {info && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px",lineHeight:2}}>
      <div><b>閲覧用リンク</b>（見るだけ）
        <button onClick={function(){copy(linkView,"閲覧用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkView}</div></div>
      <div style={{marginTop:6}}><b>編集用リンク</b>（変更もできる／取扱注意）
        <button onClick={function(){copy(linkEdit,"編集用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkEdit}</div></div>
    </div>}
    {msg && <div style={{marginTop:6,fontWeight:"bold"}}>{msg}</div>}
    <div style={{marginTop:6,fontSize:11.5,color:"#5b7fb0"}}>
      ※「サーバーに保存」を押したときだけ送信されます。押さなければ、これまで通り端末内だけで処理されます。
    </div>
  </div>);
}
